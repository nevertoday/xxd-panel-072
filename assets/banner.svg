    <linearGradient id="glassB" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffce58" stop-opacity=".72"/><stop offset="1" stop-color="#ff8f73" stop-opacity=".38"/></linearGradient>
  </defs>
  <rect width="1200" height="420" fill="#fbfaf4"/>
